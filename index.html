<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Registro de Asistencia — UE "Arutam"</title>
  <meta name="theme-color" content="#1a3a6b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-login">
  <main class="tarjeta-login">
    <h1>UNIDAD EDUCATIVA "ARUTAM"</h1>
    <p class="subtitulo">Registro de Asistencia — Sección Vespertina</p>
    <form id="form-login">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <p id="error" class="error" hidden></p>
      <button type="submit" id="btn-login">Ingresar</button>
    </form>
    <p class="version" id="lbl-version"></p>
  </main>

  <script type="module">
    import { login, sesionActual } from "./js/auth.js";
    import { APP_VERSION } from "./js/version.js";

    // Service worker: cachea los archivos estáticos para uso sin internet.
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

    document.getElementById("lbl-version").textContent = "v" + APP_VERSION;

    // Si ya hay sesión activa, ir directo a la app.
    if (sesionActual()) location.href = "app.html";

    const form = document.getElementById("form-login");
    const error = document.getElementById("error");
    const boton = document.getElementById("btn-login");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.hidden = true;
      boton.disabled = true;
      boton.textContent = "Ingresando...";
      try {
        const sesion = await login(form.usuario.value, form.password.value);
        if (sesion) {
          location.href = "app.html";
        } else {
          error.textContent = "Usuario o contraseña incorrectos.";
          error.hidden = false;
        }
      } catch (err) {
        console.error(err);
        error.textContent = "No se pudo conectar con la base de datos.";
        error.hidden = false;
      } finally {
        boton.disabled = false;
        boton.textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>
