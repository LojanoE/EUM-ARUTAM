<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Registro de Asistencia — UE "Arutam"</title>
  <meta name="theme-color" content="#1a3a6b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-login">
  <main class="tarjeta-login">
    <h1>UNIDAD EDUCATIVA "ARUTAM"</h1>
    <p class="subtitulo">Registro de Asistencia — Sección Vespertina</p>
    <form id="form-login">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <div class="campo-clave">
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="button" class="ver-clave" data-para="password" aria-label="Mostrar u ocultar la contraseña">Mostrar</button>
      </div>
      <p id="error" class="error" hidden></p>
      <button type="submit" id="btn-login">Ingresar</button>
    </form>
    <form id="form-cambiar" hidden>
      <p id="aviso-cambiar" class="info">Por seguridad, cambie la contraseña inicial antes de continuar.</p>
      <label for="pw-actual">Contraseña actual</label>
      <div class="campo-clave">
        <input type="password" id="pw-actual" autocomplete="current-password" required>
        <button type="button" class="ver-clave" data-para="pw-actual" aria-label="Mostrar u ocultar la contraseña">Mostrar</button>
      </div>
      <label for="pw-nueva">Nueva contraseña</label>
      <div class="campo-clave">
        <input type="password" id="pw-nueva" autocomplete="new-password" minlength="4" required>
        <button type="button" class="ver-clave" data-para="pw-nueva" aria-label="Mostrar u ocultar la contraseña">Mostrar</button>
      </div>
      <p class="ayuda-campo">Mínimo 4 caracteres, distinta de la actual y de su usuario.</p>
      <label for="pw-repetir">Repetir nueva contraseña</label>
      <div class="campo-clave">
        <input type="password" id="pw-repetir" autocomplete="new-password" minlength="4" required>
        <button type="button" class="ver-clave" data-para="pw-repetir" aria-label="Mostrar u ocultar la contraseña">Mostrar</button>
      </div>
      <p class="ayuda-campo" id="ayuda-repetir" hidden></p>
      <p id="error-cambiar" class="error" hidden></p>
      <button type="submit" id="btn-cambiar">Guardar contraseña</button>
      <a href="app.html" id="enlace-volver" class="enlace-grande" hidden>Volver a la plataforma</a>
    </form>
    <p class="version" id="lbl-version"></p>
  </main>

  <script type="module">
    import { login, sesionActual, cambiarPassword } from "./js/auth.js";
    import { APP_VERSION } from "./js/version.js";

    // Service worker: cachea los archivos estáticos para uso sin internet.
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

    document.getElementById("lbl-version").textContent = "v" + APP_VERSION;

    const form = document.getElementById("form-login");
    const error = document.getElementById("error");
    const boton = document.getElementById("btn-login");
    const formCambiar = document.getElementById("form-cambiar");
    const errorCambiar = document.getElementById("error-cambiar");
    const botonCambiar = document.getElementById("btn-cambiar");

    // Muestra el formulario de cambio. Si es voluntario (la sesión no lo exige)
    // se quita el aviso de obligatorio y se ofrece volver a la app.
    function mostrarCambio() {
      form.hidden = true;
      formCambiar.hidden = false;
      const obligatorio = sesionActual()?.debeCambiarPassword === true;
      document.getElementById("aviso-cambiar").hidden = !obligatorio;
      document.getElementById("enlace-volver").hidden = obligatorio;
    }

    // Con sesión activa: cambio voluntario (?cambiar=1) o directo a la app.
    const sesionInicial = sesionActual();
    if (sesionInicial) {
      if (sesionInicial.debeCambiarPassword || location.search.includes("cambiar=1")) {
        mostrarCambio();
      } else {
        location.href = "app.html";
      }
    }

    // Botones «Mostrar / Ocultar» de cada contraseña.
    document.querySelectorAll(".ver-clave").forEach((b) => {
      b.addEventListener("click", () => {
        const campo = document.getElementById(b.dataset.para);
        const ver = campo.type === "password";
        campo.type = ver ? "text" : "password";
        b.textContent = ver ? "Ocultar" : "Mostrar";
      });
    });

    // Aviso en vivo de que las dos contraseñas nuevas coinciden.
    const pwNueva = document.getElementById("pw-nueva");
    const pwRepetir = document.getElementById("pw-repetir");
    const ayudaRepetir = document.getElementById("ayuda-repetir");
    function revisarCoincidencia() {
      ayudaRepetir.hidden = !pwRepetir.value;
      const coincide = pwNueva.value === pwRepetir.value;
      ayudaRepetir.textContent = coincide ? "Las contraseñas coinciden ✓" : "Todavía no coinciden";
      ayudaRepetir.className = "ayuda-campo " + (coincide ? "ok" : "mal");
    }
    pwNueva.addEventListener("input", revisarCoincidencia);
    pwRepetir.addEventListener("input", revisarCoincidencia);

    formCambiar.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorCambiar.hidden = true;
      const nueva = document.getElementById("pw-nueva").value;
      if (nueva !== document.getElementById("pw-repetir").value) {
        errorCambiar.textContent = "Las dos contraseñas nuevas no coinciden.";
        errorCambiar.hidden = false;
        return;
      }
      botonCambiar.disabled = true;
      try {
        await cambiarPassword(document.getElementById("pw-actual").value, nueva);
        location.href = "app.html";
      } catch (err) {
        errorCambiar.textContent = err.message || "No se pudo cambiar la contraseña.";
        errorCambiar.hidden = false;
      } finally {
        botonCambiar.disabled = false;
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.hidden = true;
      boton.disabled = true;
      boton.textContent = "Ingresando...";
      try {
        const sesion = await login(form.usuario.value, form.password.value);
        if (sesion) {
          if (sesion.debeCambiarPassword) {
            mostrarCambio();
            document.getElementById("pw-actual").value = form.password.value;
            document.getElementById("pw-nueva").focus();
          } else {
            location.href = "app.html";
          }
        } else {
          error.textContent = "Usuario o contraseña incorrectos.";
          error.hidden = false;
        }
      } catch (err) {
        console.error(err);
        error.textContent = "No se pudo conectar con la base de datos.";
        error.hidden = false;
      } finally {
        boton.disabled = false;
        boton.textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>
