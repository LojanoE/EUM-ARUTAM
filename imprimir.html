<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reporte de Asistencia — UE "Arutam"</title>
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div class="no-imprimir barra-herramientas">
    <button id="btn-imprimir">Imprimir</button>
    <button onclick="window.close()">Cerrar</button>
    <span id="estado">Cargando datos...</span>
  </div>

  <!-- Contenido pintado por js/imprimir.js con hoja-asistencia.js -->
  <div id="reporte" class="hoja-asistencia" hidden></div>

  <script>
    // Service worker: permite abrir esta hoja sin internet.
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
  <script type="module" src="js/imprimir.js"></script>
</body>
</html>
