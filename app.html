<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Asistencia — UEM "Arutam"</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-titulo">
        UEM "ARUTAM"
        <small>Registro de Asistencia</small>
      </div>
      <nav id="menu">
        <button class="nav-item activo" data-modulo="dashboard">Dashboard</button>
        <button class="nav-item" data-modulo="asistencia">Asistencia</button>
        <button class="nav-item" data-modulo="estudiantes">Estudiantes</button>
        <button class="nav-item" data-modulo="horarios">Horarios</button>
        <button class="nav-item" data-modulo="grados">Grados</button>
      </nav>
      <div class="sidebar-pie">
        <span id="nombre-usuario"></span>
        <span class="version" id="lbl-version"></span>
        <button id="btn-salir">Cerrar sesión</button>
      </div>
    </aside>

    <main class="contenido-app">
      <section id="seccion-dashboard"></section>
      <section id="seccion-asistencia" hidden></section>
      <section id="seccion-estudiantes" hidden></section>
      <section id="seccion-horarios" hidden></section>
      <section id="seccion-grados" hidden></section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
