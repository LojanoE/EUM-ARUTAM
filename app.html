<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plataforma de Asistencia — UE "Arutam"</title>
  <meta name="theme-color" content="#1a3a6b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="barra-movil">
    <button id="btn-menu" class="btn-menu" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">☰</button>
    <span id="titulo-movil" class="titulo-movil">Dashboard</span>
    <span class="marca-movil">UE Arutam</span>
  </header>
  <div class="sidebar-fondo" id="sidebar-fondo" hidden></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-titulo">
        UE "ARUTAM"
        <small>Registro de Asistencia</small>
      </div>
      <nav id="menu">
        <button class="nav-item" data-modulo="dashboard">Dashboard</button>
        <button class="nav-item" data-modulo="asistencia">Asistencia</button>
        <button class="nav-item" data-modulo="estudiantes">Estudiantes</button>
        <button class="nav-item" data-modulo="horarios">Horarios</button>
        <button class="nav-item" data-modulo="notas">Notas</button>
        <button class="nav-item" data-modulo="himnos">Himnos</button>
        <button class="nav-item" data-modulo="grados">Grados</button>
        <button class="nav-item" data-modulo="docentes">Docentes</button>
        <button class="nav-item" data-modulo="cargas">Cargas</button>
        <button class="nav-item" data-modulo="usuarios">Usuarios</button>
      </nav>
      <div class="sidebar-pie">
        <span id="nombre-usuario"></span>
        <span class="version" id="lbl-version"></span>
        <div class="offline-estado">
          <span id="lbl-offline">Datos sin conexión: sin descargar</span>
          <button id="btn-offline"
            title="Volver a descargar los datos de todos los grados para poder imprimir sin internet">
            Actualizar datos
          </button>
        </div>
        <button id="btn-password">Cambiar contraseña</button>
        <button id="btn-salir">Cerrar sesión</button>
      </div>
    </aside>

    <main class="contenido-app">
      <section id="seccion-dashboard"></section>
      <section id="seccion-asistencia" hidden></section>
      <section id="seccion-estudiantes" hidden></section>
      <section id="seccion-horarios" hidden></section>
      <section id="seccion-notas" hidden></section>
      <section id="seccion-himnos" hidden></section>
      <section id="seccion-docentes" hidden></section>
      <section id="seccion-cargas" hidden></section>
      <section id="seccion-grados" hidden></section>
      <section id="seccion-usuarios" hidden></section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
