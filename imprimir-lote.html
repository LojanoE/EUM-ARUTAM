<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Impresión por lote — UEM "Arutam"</title>
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div class="no-imprimir barra-herramientas">
    <button id="btn-imprimir">Imprimir</button>
    <button onclick="window.close()">Cerrar</button>
    <span id="estado">Cargando datos...</span>
  </div>

  <!-- Una hoja por grado, pintada por js/imprimir-lote.js con hoja-asistencia.js -->
  <div id="lote"></div>

  <script>
    // Service worker: permite abrir esta hoja sin internet.
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
  <script type="module" src="js/imprimir-lote.js"></script>
</body>
</html>
